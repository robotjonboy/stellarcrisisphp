# Stellar Crisis AIO vhost — game served at /
ServerName localhost
Timeout 300
KeepAlive On
KeepAliveTimeout 5

<VirtualHost *:80>
	ServerName localhost
	ServerAdmin webmaster@localhost
	DocumentRoot /var/www/sc
	DirectoryIndex sc.php index.html

	SetEnv SC_CONFIG_PATH /data/config/serverconfig.php

	<Directory /var/www/sc>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
		php_admin_flag short_open_tag On
		php_admin_value max_execution_time 0
		php_admin_value upload_max_filesize 2M
		php_admin_value post_max_size 2M
		php_admin_value memory_limit 128M
	</Directory>

	# Generated history HTML and static history assets (MapDraw.js, styles, gifs)
	Alias /history /data/history
	<Directory /data/history>
		Options -Indexes
		AllowOverride None
		Require all granted
	</Directory>

	<Directory /var/www/sc/utility>
		Require all denied
	</Directory>
	<Directory /var/www/sc/docs>
		Require all denied
	</Directory>
	<Directory /var/www/sc/reference>
		Require all denied
	</Directory>
	<Directory /var/www/sc/docker>
		Require all denied
	</Directory>
	<Directory "/var/www/sc/sql backups">
		Require all denied
	</Directory>

	<FilesMatch "(^serverconfig\.php$|^errorlog\.html$|\.sql$|^\.env$)">
		Require all denied
	</FilesMatch>

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
