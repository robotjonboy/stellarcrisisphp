[supervisord]
nodaemon = true
user = root
logfile = /dev/null
pidfile = /run/supervisord.pid
childlogdir = /tmp

[unix_http_server]
file = /run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl = unix:///run/supervisor.sock

[program:mariadb]
command = /usr/sbin/mariadbd --user=mysql --datadir=/data/mysql
priority = 10
autorestart = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
stopasgroup = true
killasgroup = true
stopwaitsecs = 30
stopretries = 1

[program:apache2]
command = /usr/local/bin/apache-foreground
priority = 20
autorestart = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
stopasgroup = true
killasgroup = true
stopwaitsecs = 10
environment = SC_CONFIG_PATH="/data/config/serverconfig.php"
